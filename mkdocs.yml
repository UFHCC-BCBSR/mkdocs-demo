# mkdocs.yml — located at the root of your repo

site_name: MkDocs Demo
site_description: A reusable MkDocs site template with GitHub Actions auto-deployment
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    primary: black
  features:
    - navigation.sections
    - toc.integrate
    - content.code.copy
  font:
    text: Roboto

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - assets/css/custom.css

extra:
  generator: false

nav:
  - Home: index.md
  - How-To Guides:
    - Site Structure & Navigation: how-to/site-structure.md
    - Adding Images: how-to/images.md
    - Embedding Video: how-to/video.md
  - Section One:
    - Page One: 01_section-one/page-one.md
    - Page Two: 01_section-one/page-two.md
  - Section Two:
    - Page Three: 02_section-two/page-three.md

copyright: >
  © 2026 Your Group Name Here
